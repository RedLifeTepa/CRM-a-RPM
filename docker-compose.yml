services:
  flotilla:
    build: .
    container_name: control-flotilla
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-en-produccion}
      FLEET_DB_PATH: /app/data/flotilla.sqlite
      UPLOAD_DIR: /app/uploads
    volumes:
      - flotilla_data:/app/data
      - flotilla_uploads:/app/uploads

volumes:
  flotilla_data:
  flotilla_uploads:
