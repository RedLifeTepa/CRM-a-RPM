<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cenaduría - Sistema POS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- SheetJS (Excel Export) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .toast-enter { animation: toastEnter 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes toastEnter { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .pulse-red { animation: pulseRed 2s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        /* Estilo para el Ticket */
        .ticket-print { font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-stone-800 flex flex-col selection:bg-amber-200">

    <!-- Audio Element (Timbre de Cocina) -->
    <audio id="bell-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Container -->
    <div id="app" class="flex-1 flex flex-col h-full w-full"></div>

    <!-- Modals Container -->
    <div id="modal-container" class="relative z-50"></div>

    <!-- Toasts Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        /* =========================================
           1. CONSTANTES Y UTILIDADES DE JORNADA
        ========================================= */
        const APP_VERSION = 3.3;
        const SYNC_CHANNEL_NAME = 'cenaduria_sync';
        
        const STATUS = {
            KITCHEN: { PENDING: 'pending', READY: 'ready' },
            PAYMENT: { UNPAID: 'unpaid', PAID: 'paid' },
            METHOD: { CASH: 'Efectivo', CARD: 'Tarjeta', TRANSFER: 'Transferencia' }
        };

        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);
        const sanitizeHTML = (str) => {
            if(!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        };

        // LÓGICA DE JORNADA (El día termina a las 4:00 AM, no a la medianoche)
        const getBusinessDate = () => {
            const d = new Date();
            if (d.getHours() < 4) d.setDate(d.getDate() - 1);
            return d.toISOString().slice(0, 10);
        };

        const DEFAULT_DATA = {
            schemaVersion: 4, // Actualizamos schema
            restaurantName: 'La Cenaduría',
            adminPin: '999',
            currentShift: {
                id: generateId(),
                businessDate: getBusinessDate(),
                startedAt: Date.now(),
                initialFund: 1000
            },
            pastCuts: [],
            waiters: [], // {id, name, pin} -> Meseros autorizados
            categories: ['Plato Fuerte', 'Antojitos', 'Bebidas', 'Postres'],
            menu: [
                { id: 'm1', name: 'Pozole Grande', price: 85, category: 'Plato Fuerte', available: true },
                { id: 'm2', name: 'Sope Sencillo', price: 25, category: 'Antojitos', available: true },
                { id: 'm3', name: 'Agua Fresca 1L', price: 30, category: 'Bebidas', available: true }
            ],
            orders: [], 
            expenses: [], 
            activeWaiters: [] // Nombres de meseros logueados en ESTE dispositivo
        };

        /* =========================================
           2. ESTADO GLOBAL Y SINCRONIZACIÓN
        ========================================= */
        let appData = { ...DEFAULT_DATA };
        let uiState = {
            role: null,
            currentWaiter: null,
            waiterTab: 'new',
            waiterTable: '',
            cart: [],
            editingOrderId: null,
            activeCategory: 'Plato Fuerte',
            cashierTab: 'active',
        };

        let kitchenTimerInterval = null;
        let syncChannel = null;

        function initBroadcastChannel() {
            if ('BroadcastChannel' in window) {
                syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);
                syncChannel.onmessage = (event) => {
                    if (event.data.type === 'SYNC') {
                        loadDataFromStorage(false);
                        renderCurrentView();
                        
                        if (event.data.action === 'NEW_ORDER' && uiState.role === 'kitchen') {
                            playKitchenBell();
                            showToast("¡Nueva orden recibida!", "info");
                        }
                    }
                };
            }
        }

        function broadcastSync(action = 'UPDATE') {
            if (syncChannel) syncChannel.postMessage({ type: 'SYNC', action });
        }

        function playKitchenBell() {
            const bell = document.getElementById('bell-sound');
            if (bell) {
                bell.currentTime = 0;
                bell.play().catch(e => console.log('Sonido bloqueado'));
            }
        }

        setInterval(() => {
            const clockEl = document.getElementById('global-clock');
            if (clockEl) {
                clockEl.textContent = new Date().toLocaleString('es-MX', { 
                    weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
                });
            }
        }, 1000);

        function saveDataToStorage(action = 'UPDATE') {
            try {
                localStorage.setItem('cenaduria_data', JSON.stringify(appData));
                broadcastSync(action);
            } catch (error) {
                showToast("Error al guardar en memoria local", "error");
            }
        }

        function loadDataFromStorage(shouldRender = true) {
            try {
                const stored = localStorage.getItem('cenaduria_data');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (parsed.schemaVersion === DEFAULT_DATA.schemaVersion) {
                        appData = { ...DEFAULT_DATA, ...parsed };
                    } else {
                        // Migración
                        appData = { 
                            ...DEFAULT_DATA, 
                            menu: parsed.menu || DEFAULT_DATA.menu,
                            categories: parsed.categories || DEFAULT_DATA.categories,
                            waiters: parsed.waiters || DEFAULT_DATA.waiters,
                            currentShift: parsed.currentShift || DEFAULT_DATA.currentShift,
                            orders: parsed.orders || [],
                            expenses: parsed.expenses || [],
                            pastCuts: parsed.pastCuts || [],
                            schemaVersion: DEFAULT_DATA.schemaVersion 
                        };
                    }
                }
            } catch (error) {
                console.error("Data corrupta, restaurando default", error);
                appData = { ...DEFAULT_DATA };
            }
            if (shouldRender) renderCurrentView();
        }

        function checkShiftIntegrity() {
            const currentBD = getBusinessDate();
            if (appData.currentShift && appData.currentShift.businessDate !== currentBD && uiState.role) {
                showShiftRolloverModal();
            }
        }

        function showShiftRolloverModal() {
            const oldDate = new Date(appData.currentShift.startedAt).toLocaleDateString('es-MX');
            const modalHtml = `
                <div class="fixed inset-0 bg-stone-900/80 backdrop-blur-sm flex items-center justify-center z-[70] p-4 fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 text-center border-t-8 border-amber-500">
                        <div class="w-20 h-20 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6"><i class="ph ph-calendar-blank text-4xl"></i></div>
                        <h3 class="text-2xl font-black text-stone-800 mb-2">Cambio de Día Detectado</h3>
                        <p class="text-stone-500 text-sm mb-6">El sistema sigue operando en la jornada del <b>${oldDate}</b>. Para mantener las cuentas claras, te recomendamos cerrar esa jornada e iniciar la de hoy.</p>
                        
                        <div class="space-y-3">
                            <button onclick="closeShift(true)" class="w-full py-4 text-white font-bold bg-amber-500 hover:bg-amber-600 rounded-xl transition-colors shadow-md">
                                <i class="ph ph-check-circle mr-1"></i> Cerrar Jornada Anterior
                            </button>
                            <button onclick="closeModal('rollover')" class="w-full py-3 text-stone-500 font-bold bg-stone-100 hover:bg-stone-200 rounded-xl transition-colors">
                                Ignorar por ahora
                            </button>
                        </div>
                    </div>
                </div>
            `;
            const overlay = document.createElement('div');
            overlay.id = 'rollover-modal';
            overlay.innerHTML = modalHtml;
            document.body.appendChild(overlay);
        }

        function exportBackup() {
            try {
                const dataStr = JSON.stringify(appData, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Cenaduria_Backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("Backup exportado correctamente", "success");
            } catch(e) { showToast("Error al generar backup", "error"); }
        }

        function importBackup(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(parsed.menu && parsed.currentShift) {
                        appData = parsed;
                        saveDataToStorage();
                        renderCurrentView();
                        showToast("Sistema restaurado con éxito", "success");
                    } else { throw new Error("Formato inválido"); }
                } catch(error) { showToast("Error: El archivo no es un backup válido", "error"); }
            };
            reader.readAsText(file);
        }

        function initApp() {
            initBroadcastChannel();
            loadDataFromStorage();
            if (!uiState.role) renderRoleSelector();
            else renderCurrentView();
        }

        function renderCurrentView() {
            if (!uiState.role) renderRoleSelector();
            else if (uiState.role === 'waiter') renderWaiterView();
            else if (uiState.role === 'kitchen') renderKitchenView();
            else if (uiState.role === 'cashier') renderCashierView();
            
            checkShiftIntegrity();
        }

        function logoutRole() {
            uiState.role = null;
            uiState.currentWaiter = null;
            if(kitchenTimerInterval) clearInterval(kitchenTimerInterval);
            renderCurrentView();
        }

        const AppHeader = (title, showBack = true) => `
            <header class="bg-white border-b border-stone-200 px-6 py-3 flex items-center justify-between shadow-sm z-20 relative">
                <div class="flex items-center gap-4">
                    ${showBack ? `<button onclick="logoutRole()" class="p-2 hover:bg-stone-100 rounded-lg text-stone-500 transition-colors"><i class="ph ph-arrow-left text-xl"></i></button>` : ''}
                    <div>
                        <h1 class="font-bold text-stone-800 text-lg leading-tight">${sanitizeHTML(appData.restaurantName)}</h1>
                        <p class="text-xs font-semibold text-stone-400 uppercase tracking-widest">${title} | Jornada: ${appData.currentShift.businessDate}</p>
                    </div>
                </div>
                <div class="text-sm font-bold text-stone-400 bg-stone-50 px-4 py-2 rounded-xl border border-stone-100" id="global-clock">
                    Cargando hora...
                </div>
            </header>
        `;

        function renderRoleSelector() {
            document.getElementById('app').innerHTML = `
                <div class="h-full flex flex-col items-center justify-center p-6 relative">
                    <div class="text-center mb-10 fade-in">
                        <div class="w-20 h-20 bg-amber-600 text-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-amber-600/30">
                            <i class="ph ph-bowl-food text-4xl"></i>
                        </div>
                        <h1 class="text-4xl font-bold text-stone-800 mb-2">${sanitizeHTML(appData.restaurantName)}</h1>
                        <p class="text-stone-500 font-medium">Selecciona tu estación de trabajo</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl fade-in" style="animation-delay: 0.1s;">
                        <button onclick="uiState.role='waiter'; renderCurrentView();" class="group bg-white p-8 rounded-[2rem] border border-stone-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 text-left relative overflow-hidden">
                            <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><i class="ph ph-notebook text-2xl font-bold"></i></div>
                            <h2 class="text-2xl font-bold text-stone-800 mb-2">Meseros</h2>
                            <p class="text-stone-500 text-sm leading-relaxed">Toma de pedidos, edición de comandas y estado de mesas.</p>
                        </button>

                        <button onclick="uiState.role='kitchen'; renderCurrentView();" class="group bg-white p-8 rounded-[2rem] border border-stone-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 text-left relative overflow-hidden">
                            <div class="w-14 h-14 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><i class="ph ph-cooking-pot text-2xl font-bold"></i></div>
                            <h2 class="text-2xl font-bold text-stone-800 mb-2">Cocina</h2>
                            <p class="text-stone-500 text-sm leading-relaxed">Recepción de comandas en tiempo real y alertas de tiempos.</p>
                        </button>

                        <button onclick="uiState.role='cashier'; renderCurrentView();" class="group bg-white p-8 rounded-[2rem] border border-stone-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 text-left relative overflow-hidden">
                            <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><i class="ph ph-cash-register text-2xl font-bold"></i></div>
                            <h2 class="text-2xl font-bold text-stone-800 mb-2">Caja & Admin</h2>
                            <p class="text-stone-500 text-sm leading-relaxed">Cobros, corte de caja, tickets, edición de menú y reportes.</p>
                        </button>
                    </div>
                </div>
            `;
        }

        /* =========================================
           6. VISTA: MESERO (PIN LOGIN)
        ========================================= */
        function renderWaiterView() {
            let html = `<div class="flex flex-col h-full bg-[#F5F5F0] fade-in">`;
            
            if (!uiState.currentWaiter) {
                html += AppHeader('ACCESO MESEROS');
                html += `
                    <div class="flex-1 flex flex-col items-center justify-center p-6">
                        <div class="bg-white p-8 rounded-3xl shadow-sm border border-stone-200 w-full max-w-2xl text-center">
                            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="ph ph-user text-3xl"></i></div>
                            <h2 class="text-2xl font-bold text-stone-800 mb-2">Selecciona tu perfil</h2>
                            <p class="text-stone-500 text-sm mb-8">Ingresa con tu PIN asignado para comenzar</p>
                            
                            ${appData.waiters.length > 0 ? `
                                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                    ${appData.waiters.map(w => `
                                        <button onclick="promptWaiterPin('${w.id}')" class="p-4 bg-stone-50 border border-stone-200 rounded-2xl hover:bg-amber-50 hover:border-amber-400 hover:text-amber-700 transition-colors flex flex-col items-center gap-2 group">
                                            <div class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center text-stone-400 group-hover:text-amber-500"><i class="ph ph-user text-xl"></i></div>
                                            <span class="font-bold text-sm truncate w-full">${sanitizeHTML(w.name)}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            ` : `
                                <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-sm">
                                    <i class="ph ph-warning-circle text-lg inline-block align-text-bottom"></i> No hay meseros registrados. El administrador debe agregarlos desde "Ajustes de Caja".
                                </div>
                            `}
                        </div>
                    </div>
                `;
                document.getElementById('app').innerHTML = html + `</div>`;
                return;
            }

            html += AppHeader(`MESERO: ${sanitizeHTML(uiState.currentWaiter)}`);
            html += `
                <div class="bg-white border-b border-stone-200 px-4 py-2 flex items-center justify-between overflow-x-auto hide-scrollbar z-10">
                    <div class="flex gap-2">
                        <button onclick="uiState.waiterTab='new'; renderCurrentView();" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-colors ${uiState.waiterTab==='new' ? 'bg-stone-800 text-white shadow-sm' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}">
                            <i class="ph ${uiState.editingOrderId ? 'ph-pencil-simple' : 'ph-plus-circle'} text-lg align-text-bottom mr-1"></i> 
                            ${uiState.editingOrderId ? 'Editando Comanda' : 'Nueva Orden'}
                        </button>
                        <button onclick="uiState.waiterTab='active'; renderCurrentView();" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-colors ${uiState.waiterTab==='active' ? 'bg-stone-800 text-white shadow-sm' : 'bg-stone-50 text-stone-500 hover:bg-stone-100'}">
                            <i class="ph ph-list-bullets text-lg align-text-bottom mr-1"></i> Mis Mesas Activas
                        </button>
                    </div>
                    <button onclick="endWaiterShift()" class="px-4 py-2 rounded-xl text-sm font-bold bg-red-50 text-red-600 hover:bg-red-100 transition-colors flex items-center gap-2">
                        <i class="ph ph-lock-key"></i> Bloquear Sesión
                    </button>
                </div>
                
                <div class="flex-1 overflow-hidden relative" id="waiter-workspace"></div>
            </div>`;
            
            document.getElementById('app').innerHTML = html;
            updateWaiterWorkspace();
        }

        function promptWaiterPin(waiterId) {
            const waiter = appData.waiters.find(w => w.id === waiterId);
            if(!waiter) return;

            const modalHtml = `
                <div class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4 fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 relative">
                        <button onclick="closeModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600"><i class="ph ph-x text-xl"></i></button>
                        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2"><i class="ph ph-user text-3xl"></i></div>
                        <h3 class="text-xl font-black text-center text-stone-800 mb-1">${sanitizeHTML(waiter.name)}</h3>
                        <p class="text-center text-stone-500 text-sm mb-6">Ingresa tu PIN de 4 dígitos</p>
                        
                        <input type="password" id="waiter-pin-input" placeholder="••••" maxlength="4" class="w-full text-center tracking-[1em] text-4xl p-4 bg-stone-50 border border-stone-200 rounded-xl focus:border-blue-500 focus:outline-none mb-4 font-black">
                        <button id="btn-waiter-login" class="w-full py-4 text-white font-bold bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors shadow-sm">Ingresar</button>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
            const input = document.getElementById('waiter-pin-input');
            const btn = document.getElementById('btn-waiter-login');
            setTimeout(() => input.focus(), 100);
            
            const verify = () => {
                if (input.value === waiter.pin) { 
                    closeModal(); 
                    uiState.currentWaiter = waiter.name;
                    uiState.waiterTab = 'new';
                    renderCurrentView();
                } else { 
                    input.value = ''; 
                    input.classList.add('border-red-500', 'bg-red-50'); 
                    setTimeout(() => input.classList.remove('border-red-500', 'bg-red-50'), 500);
                    showToast("PIN Incorrecto", "error"); 
                }
            };
            btn.onclick = verify;
            input.onkeyup = (e) => { if(e.key === 'Enter' || input.value.length === 4) verify(); };
        }

        function endWaiterShift() {
            uiState.currentWaiter = null;
            uiState.cart = [];
            uiState.editingOrderId = null;
            uiState.waiterTable = '';
            renderCurrentView();
        }

        function handleTableInput(val) {
            uiState.waiterTable = val;
            const btn = document.getElementById('btn-send-order');
            if (btn) {
                const canSend = uiState.cart.length > 0 && uiState.waiterTable.trim() !== '';
                btn.disabled = !canSend;
                btn.className = canSend 
                    ? 'w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all bg-amber-500 text-white hover:bg-amber-600 shadow-lg shadow-amber-500/30' 
                    : 'w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all bg-stone-100 text-stone-400 cursor-not-allowed';
            }
        }

        function updateWaiterWorkspace() {
            const workspace = document.getElementById('waiter-workspace');
            if(!workspace) return;

            if (uiState.waiterTab === 'new') {
                if(!appData.categories.includes(uiState.activeCategory) && appData.categories.length > 0) {
                    uiState.activeCategory = appData.categories[0];
                }

                const catButtons = appData.categories.map(cat => `
                    <button onclick="uiState.activeCategory='${sanitizeHTML(cat)}'; updateWaiterWorkspace();" 
                            class="px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all border ${uiState.activeCategory === cat ? 'bg-stone-800 text-white border-stone-800 shadow-md' : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'}">
                        ${sanitizeHTML(cat)}
                    </button>
                `).join('');

                const menuItems = appData.menu.filter(m => m.category === uiState.activeCategory);
                const menuHtml = menuItems.map(item => `
                    <button onclick="${item.available ? `addToCart('${item.id}')` : ''}" 
                            class="bg-white p-4 rounded-3xl border ${item.available ? 'border-stone-200 hover:border-amber-400 hover:shadow-md cursor-pointer' : 'border-stone-100 opacity-60 cursor-not-allowed'} transition-all text-left flex flex-col group relative overflow-hidden">
                        <span class="font-bold text-stone-800 leading-tight mb-2 pr-4 relative z-10 group-hover:text-amber-700 transition-colors">${sanitizeHTML(item.name)}</span>
                        <div class="mt-auto flex justify-between items-center relative z-10 w-full">
                            <span class="font-medium ${item.available ? 'text-stone-500' : 'text-stone-400 line-through'}">${formatMoney(item.price)}</span>
                            ${!item.available ? '<span class="text-[10px] font-bold bg-red-100 text-red-600 px-2 py-1 rounded-md uppercase">Agotado</span>' : ''}
                        </div>
                        ${item.available ? `
                        <div class="absolute bottom-0 right-0 w-10 h-10 bg-amber-50 rounded-tl-2xl flex items-center justify-center text-amber-600 opacity-0 group-hover:opacity-100 transition-opacity z-0">
                            <i class="ph ph-plus font-bold"></i>
                        </div>` : ''}
                    </button>
                `).join('');

                const cartTotal = uiState.cart.reduce((s, i) => s + (i.price * i.quantity), 0);
                const canSend = uiState.cart.length > 0 && uiState.waiterTable.trim() !== '';

                workspace.innerHTML = `
                    <div class="flex h-full fade-in">
                        <div class="flex-1 flex flex-col border-r border-stone-200">
                            <div class="flex overflow-x-auto p-4 gap-2 hide-scrollbar bg-[#F5F5F0]">${catButtons}</div>
                            <div class="flex-1 overflow-y-auto p-4 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 content-start pb-24">${menuHtml || '<p class="col-span-full text-center text-stone-400 mt-10">Categoría vacía</p>'}</div>
                        </div>
                        <div class="w-80 lg:w-96 bg-white flex flex-col shadow-[-10px_0_20px_-10px_rgba(0,0,0,0.05)] z-20">

        function addToCart(itemId) {
            const item = appData.menu.find(m => String(m.id) === String(itemId));
            if (!item || !item.available) return;
            const existing = uiState.cart.find(i => String(i.id) === String(itemId) && !i.notes);
            if (existing) {
                existing.quantity++;
            } else {
                uiState.cart.push({ ...item, quantity: 1, notes: '' });
            }
            updateWaiterWorkspace();
        }

        function updateCartQty(index, delta) {
            const item = uiState.cart[index];
            item.quantity += delta;
            if (item.quantity <= 0) {
                uiState.cart.splice(index, 1);
            }
            updateWaiterWorkspace();
        }

        function addNoteToItem(index) {
            const item = uiState.cart[index];
            const nota = prompt("Escribe una nota para cocina (ej. Sin cebolla):", item.notes || "");
            if (nota !== null) {
                item.notes = sanitizeHTML(nota.trim().substring(0, 50));
                updateWaiterWorkspace();
            }
        }

        function sendOrder() {
            if (uiState.cart.length === 0 || uiState.waiterTable.trim() === '') return showToast("Falta mesa o platillos", "warning");
            
            const total = uiState.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            if (uiState.editingOrderId) {
                const orderIndex = appData.orders.findIndex(o => String(o.id) === String(uiState.editingOrderId));
                if (orderIndex > -1) {
                    appData.orders[orderIndex].items = [...uiState.cart];
                    appData.orders[orderIndex].total = total;
                    appData.orders[orderIndex].table = uiState.waiterTable;
                    appData.orders[orderIndex].timestamp = Date.now(); 
                }
                showToast("Comanda actualizada", "success");
            } else {
                const newOrder = {
                    id: generateId(),
                    shiftId: appData.currentShift.id,
                    businessDate: appData.currentShift.businessDate, 
                    table: uiState.waiterTable,
                    waiter: uiState.currentWaiter,
                    items: [...uiState.cart],
                    total: total,
                    kitchenStatus: STATUS.KITCHEN.PENDING,
                    paymentStatus: STATUS.PAYMENT.UNPAID,
                    timestamp: Date.now()
                };
                appData.orders.push(newOrder);
                showToast("Comanda enviada a cocina", "success");
            }

            uiState.cart = [];
            uiState.waiterTable = '';
            uiState.editingOrderId = null;
            
            saveDataToStorage('NEW_ORDER');
            updateWaiterWorkspace();
        }

        function editOrder(orderId) {
            const order = appData.orders.find(o => String(o.id) === String(orderId));
            if (order && order.kitchenStatus === STATUS.KITCHEN.PENDING) {
                uiState.editingOrderId = order.id;
                uiState.cart = JSON.parse(JSON.stringify(order.items));
                uiState.waiterTable = order.table;
                uiState.waiterTab = 'new';
                renderCurrentView();
            } else {
                showToast("No se puede editar, la cocina ya la preparó", "error");
            }
        }

        function cancelOrderEdit() {
            uiState.editingOrderId = null;
            uiState.cart = [];
            uiState.waiterTable = '';
            updateWaiterWorkspace();
        }

        ========================================= */
        function renderKitchenView() {
            let html = AppHeader('ESTACIÓN DE COCINA');
            const comandasHoy = appData.orders.filter(o => o.businessDate === appData.currentShift.businessDate && o.kitchenStatus === STATUS.KITCHEN.READY).length;

            html += `
                <div class="bg-stone-800 text-white px-6 py-3 flex justify-between items-center z-10 shadow-md">
                    <span class="font-bold tracking-widest text-sm flex items-center gap-2">
                        <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>
                        ÓRDENES EN VIVO (Jornada: ${appData.currentShift.businessDate})
                    </span>
                    <span class="bg-stone-700 px-4 py-1.5 rounded-full text-sm font-bold border border-stone-600 text-emerald-400 shadow-inner">

                    </span>
                </div>
                <div class="flex-1 p-6 overflow-y-auto bg-stone-100" id="kitchen-board"></div>
            `;
            document.getElementById('app').innerHTML = html;
            updateKitchenBoard();

            if(kitchenTimerInterval) clearInterval(kitchenTimerInterval);
            kitchenTimerInterval = setInterval(() => {
                if(uiState.role === 'kitchen') updateKitchenBoard();
            }, 10000);
        }

        function updateKitchenBoard() {
            const board = document.getElementById('kitchen-board');
            if(!board) return;

            const pending = appData.orders
                .filter(o => o.businessDate === appData.currentShift.businessDate && o.kitchenStatus === STATUS.KITCHEN.PENDING)
                .sort((a, b) => a.timestamp - b.timestamp);

            if (pending.length === 0) {
                board.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-stone-300 fade-in">
                        <i class="ph ph-coffee text-7xl mb-4 opacity-50"></i>
                        <h2 class="text-2xl font-bold text-stone-400">Cocina Limpia</h2>
                        <p class="text-stone-400 font-medium">Esperando nuevas comandas...</p>
                    </div>`;
                return;
            }

            const now = Date.now();
            board.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start fade-in">
                ${pending.map(o => {
                    const mins = Math.floor((now - o.timestamp) / 60000);
                    let colorClass = 'border-stone-200 bg-white';
                    let headerClass = 'bg-stone-100 text-stone-600';
                    let alertHtml = '';

                    if (mins >= 25) {
                        colorClass = 'border-red-400 bg-red-50 shadow-[0_0_15px_rgba(239,68,68,0.3)] pulse-red';
                        headerClass = 'bg-red-500 text-white';
                        alertHtml = '<span class="absolute -top-3 -right-3 bg-red-600 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full shadow-lg flex items-center gap-1 animate-bounce"><i class="ph ph-warning-circle"></i> URGENTE</span>';
                    } else if (mins >= 15) {
                        colorClass = 'border-amber-300 bg-amber-50/50';
                        headerClass = 'bg-amber-400 text-stone-900';
                    }

                    return `
                    <div class="rounded-2xl border-2 ${colorClass} shadow-sm overflow-hidden flex flex-col relative transition-all duration-500">
                        ${alertHtml}
                        <div class="${headerClass} p-3 flex justify-between items-center border-b border-inherit">
                            <span class="font-black text-2xl tracking-tighter">MESA ${sanitizeHTML(o.table)}</span>
                            <div class="text-right leading-tight">
                                <span class="text-xs font-bold uppercase opacity-80 block">${sanitizeHTML(o.waiter)}</span>
                                <span class="text-sm font-black flex items-center gap-1 justify-end"><i class="ph ph-clock"></i> ${mins} min</span>
                            </div>
                        </div>
                        <div class="p-4 flex-1">
                            <ul class="space-y-3">
                                ${o.items.map(item => `
                                    <li class="flex flex-col gap-1 text-lg border-b border-stone-200/50 pb-2 last:border-0">
                                        <div class="flex items-start">
                                            <span class="font-black text-stone-800 w-8">${item.quantity}x</span>
                                            <span class="font-semibold text-stone-700 leading-tight">${sanitizeHTML(item.name)}</span>
                                        </div>
                                        ${item.notes ? `<div class="ml-8 bg-amber-100/70 text-amber-900 text-sm px-2 py-1 rounded border border-amber-200/50 flex items-start gap-1 font-bold italic"><i class="ph ph-arrow-elbow-down-right mt-1 opacity-50"></i> ${sanitizeHTML(item.notes)}</div>` : ''}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                        ${o.paymentStatus === STATUS.PAYMENT.PAID ? `
                            <div class="bg-emerald-100 text-emerald-800 text-xs font-bold text-center py-1.5 uppercase tracking-widest border-t border-emerald-200">
                                Pagado por adelantado
                            </div>
                        ` : ''}
                        <button onclick="markAsReady('${o.id}')" class="w-full py-4 bg-stone-800 text-white font-black text-lg uppercase tracking-wider hover:bg-emerald-600 transition-colors flex justify-center items-center gap-2">
                            <i class="ph ph-check-square-offset text-2xl"></i> Surtido Completo
                        </button>
                    </div>
                `}).join('')}
            </div>`;
        }

        function markAsReady(orderId) {
            const order = appData.orders.find(o => String(o.id) === String(orderId));
            if (order) {
                order.kitchenStatus = STATUS.KITCHEN.READY;
                saveDataToStorage();
                showToast(`Mesa ${order.table} lista para servir`, "success");

        function promptCloseShift() {
            const shift = appData.currentShift;
            const activeOrders = appData.orders.filter(o => o.businessDate === shift.businessDate && o.paymentStatus === STATUS.PAYMENT.UNPAID);
            const paidOrders = appData.orders.filter(o => o.businessDate === shift.businessDate && o.paymentStatus === STATUS.PAYMENT.PAID);
            
            const msg = `
                <div class="text-left space-y-2 mt-4 text-sm bg-stone-50 p-4 rounded-xl border border-stone-200">
                    <p><b>${paidOrders.length}</b> mesas cobradas (Se archivarán).</p>
                    <p class="${activeOrders.length > 0 ? 'text-amber-600 font-bold' : ''}"><b>${activeOrders.length}</b> mesas pendientes (Se arrastrarán a la nueva jornada).</p>
                </div>
                <p class="mt-4">¿Estás seguro de hacer el Corte Z?</p>
            `;
            showConfirmModal("Cerrar Jornada (Z)", msg, () => closeShift(false));
        }

        function closeShift(isRollover = false) {
            const shift = appData.currentShift;
            
            const sales = appData.orders.filter(o => o.businessDate === shift.businessDate && o.paymentStatus === STATUS.PAYMENT.PAID);
            const expenses = appData.expenses.filter(e => e.businessDate === shift.businessDate);
            
            let totalS = 0; sales.forEach(o => totalS += o.total);
            let totalE = 0; expenses.forEach(e => totalE += e.amount);

            const newCut = {
                id: shift.id,
                businessDate: shift.businessDate,
                openedAt: shift.startedAt,
                closedAt: Date.now(),
                initialFund: shift.initialFund,
                totalSales: totalS,
                totalExpenses: totalE,
                orders: sales,
                expenses: expenses
            };
            if(!appData.pastCuts) appData.pastCuts = [];
            appData.pastCuts.push(newCut);
            
            appData.orders = appData.orders.filter(o => !(o.businessDate === shift.businessDate && o.paymentStatus === STATUS.PAYMENT.PAID));
            appData.expenses = appData.expenses.filter(e => e.businessDate !== shift.businessDate);
            
            const newBusinessDate = getBusinessDate();
            let newFund = shift.initialFund;
            
            if (!isRollover) {
                const val = prompt("Jornada cerrada con éxito.\nIngresa el Fondo de Caja inicial para el nuevo turno:", shift.initialFund);
                const num = parseFloat(val);
                if (!isNaN(num) && num >= 0) newFund = num;
            }

            appData.currentShift = {
                id: generateId(),
                businessDate: newBusinessDate,
                startedAt: Date.now(),
                initialFund: newFund
            };

            appData.orders.forEach(o => {
                if(o.paymentStatus === STATUS.PAYMENT.UNPAID) {
                    o.businessDate = newBusinessDate;
                    o.shiftId = appData.currentShift.id;
                }
            });

            saveDataToStorage();
            closeModal('rollover');
            showToast("Nueva jornada iniciada", "success");
            renderCurrentView();
        }

        function editCashFund() {
            const val = prompt("Ingresa el nuevo Fondo de Caja:", appData.currentShift.initialFund);
            const num = parseFloat(val);
            if (!isNaN(num) && num >= 0) {
                appData.currentShift.initialFund = num;
                saveDataToStorage();
            } else if (val !== null) {
                showToast("Cantidad inválida", "warning");
            }
        }

            appData.expenses.push({

                businessDate: appData.currentShift.businessDate,

            saveDataToStorage();

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-50 text-emerald-800 border-emerald-200',
                error: 'bg-red-50 text-red-800 border-red-200',
                warning: 'bg-amber-50 text-amber-800 border-amber-200',
                info: 'bg-stone-800 text-white border-stone-900'
            };
            const icons = { success: 'ph-check-circle', error: 'ph-x-circle', warning: 'ph-warning', info: 'ph-info' };
            
            toast.className = `px-4 py-3 rounded-xl border shadow-lg font-bold text-sm flex items-center gap-2 toast-enter ${colors[type]} pointer-events-auto`;
            toast.innerHTML = `<i class="ph ${icons[type]} text-lg"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /* =========================================
           11. EXCEL EXPORT (SHEETJS)
        ========================================= */
        function exportCutExcel(cutId = null) {
            if (typeof XLSX === 'undefined') return showToast("Cargando librerías, intenta de nuevo.", "warning");
            
            let sales, exp, fondo, fechaInicio, fechaCierre, bDate;

            if (cutId) {
                // Exportar histórico
                const pastCut = appData.pastCuts.find(c => String(c.id) === String(cutId));
                if (!pastCut) return;
                sales = pastCut.orders;
                exp = pastCut.expenses;
                fondo = pastCut.initialFund;
                fechaInicio = new Date(pastCut.openedAt).toLocaleString('es-MX');
                fechaCierre = new Date(pastCut.closedAt).toLocaleString('es-MX');
                bDate = pastCut.businessDate;
                showToast("Generando Excel de jornada archivada...", "info");
            } else {
                // Exportar actual
                sales = appData.orders.filter(o => o.businessDate === appData.currentShift.businessDate && o.paymentStatus === STATUS.PAYMENT.PAID);
                exp = appData.expenses.filter(e => e.businessDate === appData.currentShift.businessDate);
                fondo = appData.currentShift.initialFund;
                fechaInicio = new Date(appData.currentShift.startedAt).toLocaleString('es-MX');
                fechaCierre = "Turno en curso";
                bDate = appData.currentShift.businessDate;
                showToast("Generando Excel de turno actual...", "info");
            }

            // Hoja 1: Resumen y Rendimiento Meseros
            let tEfectivo = 0, tTarjeta = 0, tTransfer = 0;
            const waiterSales = {};

            sales.forEach(o => {
                if(o.paymentMethod === STATUS.METHOD.CASH) tEfectivo += o.total;
                if(o.paymentMethod === STATUS.METHOD.CARD) tTarjeta += o.total;
                if(o.paymentMethod === STATUS.METHOD.TRANSFER) tTransfer += o.total;
                waiterSales[o.waiter] = (waiterSales[o.waiter] || 0) + o.total;
            });
            const tGastos = exp.reduce((s, e) => s + e.amount, 0);

            const wsResumenData = [
                ["REPORTE DE CORTE DE CAJA", ""],
                ["Jornada de Negocio:", bDate],
                ["Apertura:", fechaInicio],
                ["Cierre:", fechaCierre],
                [],
                ["Concepto", "Monto"],
                ["Fondo Inicial", fondo],
                ["Ventas Efectivo", tEfectivo],
                ["Ventas Tarjeta", tTarjeta],
                ["Ventas Transferencia", tTransfer],
                ["Total Ingresos Brutos", tEfectivo + tTarjeta + tTransfer],
                ["Total Gastos / Salidas", -tGastos],
                ["EFECTIVO FÍSICO ESPERADO", fondo + tEfectivo - tGastos]
            ];

            // Hoja 2: Rendimiento Meseros
            const wsMeserosData = [["Mesero", "Total Vendido en Turno"]];
            Object.keys(waiterSales).sort((a,b) => waiterSales[b] - waiterSales[a]).forEach(w => {
                wsMeserosData.push([w, waiterSales[w]]);
            });

            // Hoja 3: Comandas
            const wsComandasData = [["Hora", "Mesa", "Mesero", "Método Pago", "Total", "Detalle Pedido"]];
            sales.forEach(o => {
                const detalle = o.items.map(i => `${i.quantity}x ${i.name}`).join(', ');
                wsComandasData.push([
                    new Date(o.paymentTime).toLocaleTimeString('es-MX'),
                    o.table, o.waiter, o.paymentMethod, o.total, detalle
                ]);
            });

            // Hoja 4: Gastos
            const wsGastosData = [["Hora", "Concepto", "Monto"]];
            exp.forEach(e => {
                wsGastosData.push([new Date(e.timestamp).toLocaleTimeString('es-MX'), e.concept, e.amount]);
            });

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsResumenData), "Resumen Financiero");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsMeserosData), "Rendimiento Meseros");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsComandasData), "Detalle Comandas");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsGastosData), "Detalle Gastos");
            
            const fileName = cutId ? `Corte_Archivado_${bDate}.xlsx` : `Corte_Actual_${bDate}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        // Arrancar
        window.onload = initApp;

    </script>
</body>
</html>
